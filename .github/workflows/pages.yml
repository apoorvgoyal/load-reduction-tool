# Publish the tool as a static site on GitHub Pages. EnergyPlus runs in each
# visitor's browser (web/ep-browser.js), so no server is needed.
# Manual trigger: Actions tab -> "Deploy to GitHub Pages" -> Run workflow.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # web/ plus the engine files the browser runner fetches, and the 27
      # stations' TMY3 weather files (downloaded from the DOE library).
      - run: python3 engine/web_files.py build-site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
